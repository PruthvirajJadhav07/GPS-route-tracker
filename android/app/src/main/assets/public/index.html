<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPS Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📡</span>
                    <h1>GPS Tracker</h1>
                </div>
                <div id="status-badge" class="badge badge-idle">Idle</div>
            </div>
        </header>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Info Panel -->
        <div id="info-panel">
            <div class="info-row">
                <div class="info-card">
                    <span class="info-label">Latitude</span>
                    <span id="lat-display" class="info-value">--</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Longitude</span>
                    <span id="lon-display" class="info-value">--</span>
                </div>
            </div>
            <div class="info-row">
                <div class="info-card">
                    <span class="info-label">Speed</span>
                    <span id="speed-display" class="info-value">-- km/h</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Points Sent</span>
                    <span id="points-display" class="info-value">0</span>
                </div>
            </div>
        </div>

        <!-- Control Button -->
        <div id="controls">
            <button id="track-btn" onclick="toggleTracking()">
                <span id="btn-icon">▶</span>
                <span id="btn-text">Start Tracking</span>
            </button>
        </div>
    </div>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBRZBD6keKsDP6vcw4JJWyNjJyWtEmQF6Q"></script>

    <script src="js/app.js"></script>
</body>
</html>
