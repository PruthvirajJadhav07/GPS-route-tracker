<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Live Route Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #4285F4;
    --primary-dark: #2b6fd4;
    --bg-dark: #0f1117;
    --border: rgba(255, 255, 255, 0.08);
    --text-primary: #ffffff;
    --text-secondary: #9aa0b4;
    --radius: 16px;
}

/* Reset */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Background */
body {
    font-family: 'Fira Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    overflow: hidden;
    color: var(--text-primary);
}

body::after {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(66,133,244,0.15), transparent 60%);
    top: -100px;
    left: -100px;
    animation: ghostLightMove 18s infinite alternate ease-in-out;
    pointer-events: none;
}

@keyframes ghostLightMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(300px,200px); }
    100% { transform: translate(600px,50px); }
}

/* Liquid Background Blobs */
.bg-blobs span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    animation: liquidMove 20s infinite ease-in-out;
}

.bg-blobs span:nth-child(1) {
    width: 420px;
    height: 420px;
    background: #4285F4;
    top: 10%;
    left: 10%;
}

.bg-blobs span:nth-child(2) {
    width: 360px;
    height: 360px;
    background: #6a5cff;
    bottom: 10%;
    right: 10%;
    animation-delay: 4s;
}

.bg-blobs span:nth-child(3) {
    width: 300px;
    height: 300px;
    background: #00c6ff;
    top: 60%;
    left: 40%;
    animation-delay: 8s;
}

.bg-blobs span:nth-child(4) {
    width: 260px;
    height: 260px;
    background: #ff4ecd;
    top: 30%;
    right: 25%;
    animation-delay: 12s;
}

@keyframes liquidMove {
    0% { transform: translate(0,0) scale(1); }
    25% { transform: translate(60px,-40px) scale(1.1); }
    50% { transform: translate(-40px,60px) scale(0.9); }
    75% { transform: translate(30px,30px) scale(1.05); }
    100% { transform: translate(0,0) scale(1); }
}

/* Glass Card */
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 60px 48px;
    background: rgba(26, 29, 39, 0.55);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: cardFloat 6s ease-in-out infinite;
    transition: transform 0.3s, box-shadow 0.3s;
}

.auth-card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(120deg, #4285F4, #6a5cff, #00c6ff, #ff4ecd);
    background-size: 400% 400%;
    z-index: -1;
    filter: blur(18px);
    opacity: 0.35;
    animation: ghostGlow 8s ease infinite;
}

@keyframes ghostGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.auth-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 30px 90px rgba(66,133,244,0.25);
}

@keyframes cardFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

/* Inputs */
.input-group {
    position: relative;
    margin-bottom: 30px;
}

.input-group input {
    width: 100%;
    padding: 18px 16px 10px;
    font-size: 0.95rem;
    color: white;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s;
}

.input-group input:focus {
    border-color: #6a5cff;
    box-shadow: 
        0 0 10px rgba(106,92,255,0.5),
        0 0 20px rgba(106,92,255,0.4),
        0 0 40px rgba(106,92,255,0.2);
    transform: scale(1.02);
}

.input-group label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    transition: all 0.2s;
}

.input-group input:focus~label,
.input-group input:not(:placeholder-shown)~label {
    top: 10px;
    font-size: 0.72rem;
    color: var(--primary);
}

/* Liquid Gradient Button */
.btn-primary {
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(270deg, #4285F4, #6a5cff, #00c6ff);
    background-size: 400% 400%;
    animation: gradientFlow 6s ease infinite;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
}

.btn-primary {
    animation: gradientFlow 6s ease infinite, ghostPulse 3s ease-in-out infinite;
}

@keyframes ghostPulse {
    0% { box-shadow: 0 0 0 rgba(66,133,244,0.4); }
    50% { box-shadow: 0 0 25px rgba(66,133,244,0.6); }
    100% { box-shadow: 0 0 0 rgba(66,133,244,0.4); }
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(66,133,244,0.45);
}

/* Button Shine */
.btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transition: 0.6s;
}

.btn-primary:hover::before {
    left: 100%;
}

@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Footer */
.footer-link {
    text-align: center;
    margin-top: 36px;
    color: var(--text-secondary);
    font-size: 0.85rem;
}

.footer-link a {
    color: var(--primary);
    text-decoration: none;
}
</style>
</head>
<body>

    <div class="bg-blobs">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="auth-card">
        <div class="logo">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11" />
                </svg>
            </div>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle">Join Tracker Dashboard</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}" id="registerForm" autocomplete="off">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required
                       value="{{ username|default:'' }}" autofocus>
                <label for="username">Username</label>
            </div>

            <div class="input-group">
                <input type="email" id="email" name="email" placeholder=" "
                       value="{{ email|default:'' }}">
                <label for="email">Email (optional)</label>
            </div>

            <div class="input-group">
                <input type="password" id="password1" name="password1" placeholder=" " required>
                <label for="password1">Password</label>
                <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="input-group">
                <input type="password" id="password2" name="password2" placeholder=" " required>
                <label for="password2">Confirm Password</label>
                <div class="match-hint" id="matchHint"></div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="{% url 'login' %}">Sign In</a>
        </div>
    </div>

    <script>
    (function(){
        const pw1   = document.getElementById('password1');
        const pw2   = document.getElementById('password2');
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        const hint  = document.getElementById('matchHint');

        // ---- password strength ----
        pw1.addEventListener('input', function(){
            const v = pw1.value;
            let score = 0;
            if(v.length >= 4) score++;
            if(v.length >= 8) score++;
            if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
            if(/\d/.test(v)) score++;
            if(/[^A-Za-z0-9]/.test(v)) score++;

            const levels = [
                { w:'0%',  c:'transparent',label:'', color:'var(--text-secondary)' },
                { w:'20%', c:'var(--danger)',    label:'Very weak', color:'var(--danger)' },
                { w:'40%', c:'#ff9f43',    label:'Weak',      color:'#ff9f43' },
                { w:'60%', c:'#feca57',    label:'Fair',      color:'#feca57' },
                { w:'80%', c:'var(--primary)',    label:'Strong',    color:'var(--primary)' },
                { w:'100%',c:'var(--primary-dark)',    label:'Very strong',color:'var(--primary-dark)' }
            ];
            const l = levels[score];
            fill.style.width      = l.w;
            fill.style.background = l.c;
            label.textContent     = v ? l.label : '';
            label.style.color     = l.color;

            checkMatch();
        });

        // ---- password match ----
        pw2.addEventListener('input', checkMatch);

        function checkMatch(){
            const v1 = pw1.value, v2 = pw2.value;
            if(!v2){ hint.textContent=''; pw2.classList.remove('input-error'); return; }
            if(v1 === v2){
                hint.textContent = '✓ Passwords match';
                hint.className   = 'match-hint match';
                pw2.classList.remove('input-error');
            } else {
                hint.textContent = '✗ Passwords do not match';
                hint.className   = 'match-hint no-match';
                pw2.classList.add('input-error');
            }
        }
    })();
    </script>

</body>
</html>
