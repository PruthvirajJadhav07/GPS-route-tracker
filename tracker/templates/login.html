{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RouteHawk Live Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════ */
/* SPLASH SCREEN — Game-style loading cover   */
/* ═══════════════════════════════════════════ */
#splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

#splash-screen.fade-out {
    opacity: 0;
    visibility: hidden;
}

.splash-bg {
    position: absolute;
    inset: 0;
    background-image: url('{% static "images/splash_bg.jpeg" %}');
    background-size: cover;
    background-position: 65% center;
    background-repeat: no-repeat;
    filter: brightness(0.45) saturate(1.3);
    animation: splashZoom 6.5s ease-out forwards;
}

@keyframes splashZoom {
    0%   { transform: scale(1.15); filter: brightness(0) saturate(1.3); }
    30%  { filter: brightness(0.45) saturate(1.3); }
    100% { transform: scale(1.0); filter: brightness(0.4) saturate(1.3); }
}

.splash-content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: splashFadeIn 1.2s ease 0.3s both;
}

@keyframes splashFadeIn {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
}

.splash-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #4285F4, #00c6ff);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(66,133,244,0.4);
    animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
    0%, 100% { box-shadow: 0 10px 40px rgba(66,133,244,0.4); }
    50%      { box-shadow: 0 15px 60px rgba(66,133,244,0.7); }
}

.splash-icon svg {
    width: 40px;
    height: 40px;
    color: white;
}

.splash-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
    text-shadow: 0 0 30px rgba(66,133,244,0.5);
}

.splash-subtitle {
    font-family: 'Fira Sans', sans-serif;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 50px;
}

/* Loading Bar */
.splash-loader {
    width: 280px;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin: 0 auto 16px;
}

.splash-loader-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4285F4, #00c6ff, #6a5cff);
    border-radius: 4px;
    animation: loaderFill 5s ease-in-out forwards;
    box-shadow: 0 0 15px rgba(66,133,244,0.6);
}

@keyframes loaderFill {
    0%   { width: 0%; }
    20%  { width: 25%; }
    50%  { width: 60%; }
    75%  { width: 85%; }
    100% { width: 100%; }
}

.splash-loading-text {
    font-family: 'Fira Code', monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    animation: textBlink 1.5s ease-in-out infinite;
}

@keyframes textBlink {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.8; }
}

/* Bottom branding */
.splash-footer {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 2;
    animation: splashFadeIn 1.5s ease 0.8s both;
}

.splash-footer span {
    font-family: 'Fira Sans', sans-serif;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 3px;
    text-transform: uppercase;
}

.splash-version {
    display: block;
    margin-top: 4px;
    font-family: 'Fira Code', monospace;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.15);
}
:root {
    --primary: #4285F4;
    --primary-dark: #2b6fd4;
    --bg-dark: #0f1117;
    --border: rgba(255, 255, 255, 0.08);
    --text-primary: #ffffff;
    --text-secondary: #9aa0b4;
    --radius: 16px;
}

/* Reset */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Background */
body {
    font-family: 'Fira Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    overflow: hidden;
    color: var(--text-primary);
}

body::after {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(66,133,244,0.15), transparent 60%);
    top: -100px;
    left: -100px;
    animation: ghostLightMove 18s infinite alternate ease-in-out;
    pointer-events: none;
}

@keyframes ghostLightMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(300px,200px); }
    100% { transform: translate(600px,50px); }
}

/* Liquid Background Blobs */
.bg-blobs span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    animation: liquidMove 20s infinite ease-in-out;
}

.bg-blobs span:nth-child(1) {
    width: 420px;
    height: 420px;
    background: #4285F4;
    top: 10%;
    left: 10%;
}

.bg-blobs span:nth-child(2) {
    width: 360px;
    height: 360px;
    background: #6a5cff;
    bottom: 10%;
    right: 10%;
    animation-delay: 4s;
}

.bg-blobs span:nth-child(3) {
    width: 300px;
    height: 300px;
    background: #00c6ff;
    top: 60%;
    left: 40%;
    animation-delay: 8s;
}

.bg-blobs span:nth-child(4) {
    width: 260px;
    height: 260px;
    background: #ff4ecd;
    top: 30%;
    right: 25%;
    animation-delay: 12s;
}

@keyframes liquidMove {
    0% { transform: translate(0,0) scale(1); }
    25% { transform: translate(60px,-40px) scale(1.1); }
    50% { transform: translate(-40px,60px) scale(0.9); }
    75% { transform: translate(30px,30px) scale(1.05); }
    100% { transform: translate(0,0) scale(1); }
}

/* Glass Card */
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 60px 48px;
    background: rgba(26, 29, 39, 0.55);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: cardFloat 6s ease-in-out infinite;
    transition: transform 0.3s, box-shadow 0.3s;
}

.auth-card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(120deg, #4285F4, #6a5cff, #00c6ff, #ff4ecd);
    background-size: 400% 400%;
    z-index: -1;
    filter: blur(18px);
    opacity: 0.35;
    animation: ghostGlow 8s ease infinite;
}

@keyframes ghostGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.auth-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 30px 90px rgba(66,133,244,0.25);
}

@keyframes cardFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

/* Inputs */
.input-group {
    position: relative;
    margin-bottom: 30px;
}

.input-group input {
    width: 100%;
    padding: 18px 16px 10px;
    font-size: 0.95rem;
    color: white;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s;
}

.input-group input:focus {
    border-color: #6a5cff;
    box-shadow: 
        0 0 10px rgba(106,92,255,0.5),
        0 0 20px rgba(106,92,255,0.4),
        0 0 40px rgba(106,92,255,0.2);
    transform: scale(1.02);
}

.input-group label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    transition: all 0.2s;
}

.input-group input:focus~label,
.input-group input:not(:placeholder-shown)~label {
    top: 10px;
    font-size: 0.72rem;
    color: var(--primary);
}

/* Liquid Gradient Button */
.btn-primary {
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(270deg, #4285F4, #6a5cff, #00c6ff);
    background-size: 400% 400%;
    animation: gradientFlow 6s ease infinite;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
}

.btn-primary {
    animation: gradientFlow 6s ease infinite, ghostPulse 3s ease-in-out infinite;
}

@keyframes ghostPulse {
    0% { box-shadow: 0 0 0 rgba(66,133,244,0.4); }
    50% { box-shadow: 0 0 25px rgba(66,133,244,0.6); }
    100% { box-shadow: 0 0 0 rgba(66,133,244,0.4); }
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(66,133,244,0.45);
}

/* Button Shine */
.btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transition: 0.6s;
}

.btn-primary:hover::before {
    left: 100%;
}

@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Footer */
.footer-link {
    text-align: center;
    margin-top: 36px;
    color: var(--text-secondary);
    font-size: 0.85rem;
}

.footer-link a {
    color: var(--primary);
    text-decoration: none;
}
</style>
</head>

<body>

    <!-- ═══════════════════════════════════════════ -->
    <!-- SPLASH SCREEN — Full cover loading overlay -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="splash-screen">
        <div class="splash-bg"></div>

        <div class="splash-content">
            <div class="splash-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11" />
                </svg>
            </div>
            <div class="splash-title">RouteHawk</div>
            <div class="splash-subtitle">Live Tracking System</div>

            <div class="splash-loader">
                <div class="splash-loader-bar"></div>
            </div>
            <div class="splash-loading-text">INITIALIZING GPS SYSTEMS...</div>
        </div>

        <div class="splash-footer">
            <span>Enterprise Fleet Intelligence</span>
            <span class="splash-version">v2.1.0</span>
        </div>
    </div>

    <div class="bg-blobs">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="auth-card">
        <div class="logo">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11" />
                </svg>
            </div>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to Tracker Dashboard</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" autocomplete="off">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required autofocus>
                <label for="username">Username</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </div>
    </div>

    <script>
        // Auto-dismiss splash screen after loading bar completes
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                // Remove from DOM after fade animation
                setTimeout(() => splash.remove(), 900);
            }
        }, 5500);
    </script>

</body>

</html>
