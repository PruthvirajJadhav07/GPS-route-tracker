name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          npm install @capacitor-community/background-geolocation@latest
          cap add ios || true
          cap sync ios
          
          # Inject iOS Background Location permissions directly into Info.plist
          cd ios/App/App
          plutil -replace NSLocationWhenInUseUsageDescription -string "RouteHawk needs location to track your route." Info.plist
          plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "RouteHawk needs background location to track your route when screen is locked." Info.plist
          plutil -replace NSLocationAlwaysUsageDescription -string "RouteHawk needs background location to track your route when screen is locked." Info.plist
          
          # Add UIBackgroundModes array and append 'location'
          plutil -extract UIBackgroundModes xml1 -o - Info.plist > /dev/null 2>&1 || plutil -insert UIBackgroundModes -array Info.plist
          plutil -insert UIBackgroundModes.0 -string "location" Info.plist || true
          cd ../../..
          
          # CRITICAL FIX: Switch from dynamic frameworks to static linking.
          # This bakes Capacitor/Cordova code directly into the app binary,
          # completely eliminating the framework embedding problem.
          cd ios/App
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/' Podfile
          pod install

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create and Validate .ipa
        run: |
          cd frontend/ios/App/derivedData/Build/Products/Release-iphoneos
          
          # Validate Info.plist is not corrupted
          echo "=== Validating Info.plist ==="
          plutil -lint App.app/Info.plist
          
          # Show what file type Info.plist actually is
          file App.app/Info.plist
          
          # Show app bundle size
          echo "=== App.app total size ==="
          du -sh App.app
          
          # Show the main binary size (should be several MB with static linking)
          echo "=== Main binary size ==="
          ls -lh App.app/App
          
          # Convert Info.plist from binary to XML for maximum compatibility
          plutil -convert xml1 App.app/Info.plist
          
          # Print full Info.plist so we can verify all required keys
          echo "=== Full Info.plist contents ==="
          cat App.app/Info.plist
          
          # Create IPA using standard zip (ditto adds __MACOSX which breaks AltStore!)
          mkdir Payload
          cp -R App.app Payload/
          zip -r RouteHawk.ipa Payload -x "*.DS_Store"
          
          echo "=== Final IPA size ==="
          ls -lh RouteHawk.ipa
          
          echo "=== IPA Contents (Proof for your friend) ==="
          unzip -l RouteHawk.ipa | grep -E "App$|Info.plist|index.html|app.js"
          
          echo "Build complete. IPA is ready."

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/derivedData/Build/Products/Release-iphoneos/RouteHawk.ipa
