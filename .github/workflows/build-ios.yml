name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios
          
          # CRITICAL FIX: Switch from dynamic frameworks to static linking.
          # This bakes Capacitor/Cordova code directly into the app binary,
          # completely eliminating the framework embedding problem.
          cd ios/App
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/' Podfile
          pod install

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create and Validate .ipa
        run: |
          cd frontend/ios/App/derivedData/Build/Products/Release-iphoneos
          
          # Validate Info.plist is not corrupted
          echo "=== Validating Info.plist ==="
          plutil -lint App.app/Info.plist
          
          # Show what file type Info.plist actually is
          file App.app/Info.plist
          
          # Show app bundle size
          echo "=== App.app total size ==="
          du -sh App.app
          
          # Show the main binary size (should be several MB with static linking)
          echo "=== Main binary size ==="
          ls -lh App.app/App
          
          # Convert Info.plist from binary to XML for maximum compatibility
          plutil -convert xml1 App.app/Info.plist
          
          # Print full Info.plist so we can verify all required keys
          echo "=== Full Info.plist contents ==="
          cat App.app/Info.plist
          
          # Create IPA using Apple's own ditto tool (not zip)
          # This creates the exact ZIP format that Xcode and AltStore expect
          mkdir Payload
          cp -R App.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload RouteHawk.ipa
          
          echo "=== Final IPA size ==="
          ls -lh RouteHawk.ipa
          echo "=== Verify IPA is a valid ZIP ==="
          file RouteHawk.ipa
          echo "Build complete. IPA is ready."

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/derivedData/Build/Products/Release-iphoneos/RouteHawk.ipa
