name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios

      - name: Patch CocoaPods to embed frameworks without signing
        run: |
          cd frontend/ios/App
          # CocoaPods has a script that skips framework embedding when signing is disabled.
          # We patch EVERY script that contains this check.
          find Pods/Target\ Support\ Files -name "*.sh" -exec sed -i '' 's/if \[ -z "${CODE_SIGNING_ALLOWED:-}" \]; then CODE_SIGNING_ALLOWED=YES; fi/CODE_SIGNING_ALLOWED=YES/g' {} \;
          find Pods/Target\ Support\ Files -name "*.sh" -exec sed -i '' 's/"${CODE_SIGNING_ALLOWED}" != "NO"/"YES" != "NO"/g' {} \;

      - name: Build iOS Archive
        run: |
          cd frontend/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/RouteHawk.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create .ipa from Archive
        run: |
          cd frontend/ios/App
          APP_PATH="RouteHawk.xcarchive/Products/Applications/App.app"
          
          # If CocoaPods STILL didn't embed, brute-force find and copy every framework
          mkdir -p "$APP_PATH/Frameworks"
          find RouteHawk.xcarchive -name "Capacitor.framework" -not -path "*/App.app/*" | head -1 | xargs -I{} cp -R {} "$APP_PATH/Frameworks/" 2>/dev/null || true
          find RouteHawk.xcarchive -name "Cordova.framework" -not -path "*/App.app/*" | head -1 | xargs -I{} cp -R {} "$APP_PATH/Frameworks/" 2>/dev/null || true
          find RouteHawk.xcarchive -name "Pods_App.framework" -not -path "*/App.app/*" | head -1 | xargs -I{} cp -R {} "$APP_PATH/Frameworks/" 2>/dev/null || true
          
          # Debug: print what is inside the final app
          echo "=== Final App.app size ==="
          du -sh "$APP_PATH"
          echo "=== Info.plist first 3 lines ==="
          head -3 "$APP_PATH/Info.plist"
          echo "=== Frameworks directory ==="
          ls -la "$APP_PATH/Frameworks/"
          
          # Create IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -ry RouteHawk.ipa Payload
          
          echo "=== Final IPA size ==="
          ls -lh RouteHawk.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/RouteHawk.ipa
