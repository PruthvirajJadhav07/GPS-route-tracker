name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios
          
      - name: Build Unsigned iOS App
        run: |
          cd frontend/ios/App
          sed -i '' 's/CODE_SIGNING_ALLOWED" == "NO"/CODE_SIGNING_ALLOWED" == "NEVER"/g' "Pods/Target Support Files/Pods-App/Pods-App-frameworks.sh" || true
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath derivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Convert to .ipa file
        run: |
          cd frontend/ios/App/derivedData/Build/Products/Release-iphoneos
          # Manually embed missing frameworks because CocoaPods refuses to do it for unsigned builds
          mkdir -p App.app/Frameworks
          cp -R Capacitor/Capacitor.framework App.app/Frameworks/ 2>/dev/null || true
          cp -R CapacitorCordova/Cordova.framework App.app/Frameworks/ 2>/dev/null || true
          cp -R Pods_App.framework App.app/Frameworks/ 2>/dev/null || true
          
          mkdir Payload
          mv App.app Payload/
          zip -ry RouteHawk.ipa Payload
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/derivedData/Build/Products/Release-iphoneos/RouteHawk.ipa
