name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios
          
      - name: Build Unsigned iOS App
        run: |
          cd frontend/ios/App
          xcodebuild clean build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Convert to .ipa file
        run: |
          cd frontend/ios/App/build/Release-iphoneos
          mkdir Payload
          mv App.app Payload/
          zip -r RouteHawk.ipa Payload
          
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/build/Release-iphoneos/RouteHawk.ipa
