name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios
          
          # CRITICAL FIX: Switch from dynamic frameworks to static linking.
          # This bakes Capacitor/Cordova code directly into the app binary,
          # completely eliminating the framework embedding problem.
          cd ios/App
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/' Podfile
          pod install

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create and Validate .ipa
        run: |
          cd frontend/ios/App/derivedData/Build/Products/Release-iphoneos
          
          # Validate Info.plist is not corrupted
          echo "=== Validating Info.plist ==="
          plutil -lint App.app/Info.plist
          
          # Show what file type Info.plist actually is
          file App.app/Info.plist
          
          # Show app bundle size
          echo "=== App.app total size ==="
          du -sh App.app
          
          # Show the main binary size (should be several MB with static linking)
          echo "=== Main binary size ==="
          ls -lh App.app/App
          
          # Create IPA with proper structure
          mkdir Payload
          cp -R App.app Payload/
          zip -ry RouteHawk.ipa Payload
          
          # SAFETY CHECK: Fail the build if IPA is under 1.5 MB
          # This prevents downloading a broken file
          IPA_SIZE=$(stat -f%z RouteHawk.ipa)
          echo "=== Final IPA size: $IPA_SIZE bytes ==="
          if [ "$IPA_SIZE" -lt 1500000 ]; then
            echo "FATAL: IPA is only $IPA_SIZE bytes. Something is wrong. Failing build."
            echo "=== Listing App.app contents for debugging ==="
            find App.app -type f -exec ls -lh {} \;
            exit 1
          fi
          echo "IPA size check PASSED."

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/derivedData/Build/Products/Release-iphoneos/RouteHawk.ipa
