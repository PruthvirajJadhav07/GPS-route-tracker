name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli@6
          cd frontend
          rm -rf node_modules
          npm install @capacitor/core@6 @capacitor/ios@6
          cap add ios || true
          cap sync ios

      - name: Build iOS Archive
        run: |
          cd frontend/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/RouteHawk.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create .ipa from Archive
        run: |
          cd frontend/ios/App
          APP_PATH="RouteHawk.xcarchive/Products/Applications/App.app"
          
          # Debug: show what we built
          echo "=== App bundle contents ==="
          ls -la "$APP_PATH/"
          echo "=== Info.plist check ==="
          head -5 "$APP_PATH/Info.plist"
          echo "=== Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"
          
          # Create proper IPA structure
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -ry RouteHawk.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteHawk-iOS
          path: frontend/ios/App/RouteHawk.ipa
